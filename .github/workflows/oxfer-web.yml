name: oxfer-web

on:
  push:
    branches: [main]
    paths:
      - "p2p-transfer/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/oxfer-web.yml"
  workflow_dispatch:

concurrency:
  group: oxfer-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: p2p-transfer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build browser app
        run: bash build-web.sh

      - name: Deploy with cf
        env:
          CI: true
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Set GitHub Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID." >&2
            echo "Token: Cloudflare dashboard → Account API tokens → Create token → Edit Cloudflare Workers." >&2
            exit 1
          fi
          npx --yes cf@1.0.0-beta.5 deploy --prebuilt

      - name: Verify production
        run: |
          node verify-deployment.mjs https://oxfer.42dev.workers.dev/
          node verify-deployment.mjs https://www.oxfer.app/
          node verify-deployment.mjs https://oxfer.app/
