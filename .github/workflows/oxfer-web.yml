name: oxfer-web

on:
  push:
    branches: [main]
    paths:
      - "p2p-transfer/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - ".github/workflows/oxfer-web.yml"
  workflow_dispatch:

concurrency:
  group: oxfer-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Self-hosted relay list compiled into the wasm and rendered into the
      # CSP (build-web.sh, verify-deployment.mjs). Empty until the repository
      # variable is set, which keeps n0's public relays.
      P2P_RELAY_URL: ${{ vars.P2P_RELAY_URL }}
    defaults:
      run:
        working-directory: p2p-transfer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: p2p-transfer/package-lock.json

      - name: Install cf CLI
        run: npm ci

      - name: Build browser app
        run: npm run build

      # Publish the SHA-256 of every served file so anyone can compare it with
      # what oxfer.app serves. _headers is excluded: Cloudflare applies it
      # rather than serving it, and the package renders its relay token.
      - name: Record bundle hashes
        run: |
          set -o pipefail
          (cd dist && find . -type f ! -path ./_headers -printf '%P\0' | LC_ALL=C sort -z | xargs -0 sha256sum --) > oxfer-web-sha256.txt
          test -s oxfer-web-sha256.txt
          {
            echo "### Oxfer web bundle SHA-256"
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo
            echo '```text'
            cat oxfer-web-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle hashes
        uses: actions/upload-artifact@v4
        with:
          name: oxfer-web-sha256-${{ github.sha }}
          path: p2p-transfer/oxfer-web-sha256.txt
          if-no-files-found: error

      - name: Deploy with cf
        env:
          CI: true
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Set GitHub Actions secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID." >&2
            echo "Token: Cloudflare dashboard → Account API tokens → Create token → Edit Cloudflare Workers." >&2
            exit 1
          fi
          npx cf deploy --prebuilt

      # Checks the three origins concurrently. Besides bytes and headers,
      # verify-deployment.mjs fails while Cloudflare Network Error Logging
      # (NEL/Report-To headers) is on for the oxfer.app zone. workers.dev is
      # outside that zone, so there it only warns.
      - name: Verify production
        run: node verify-deployment.mjs https://oxfer.42dev.workers.dev/ https://www.oxfer.app/ https://oxfer.app/
