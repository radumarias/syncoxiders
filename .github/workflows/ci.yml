name: ci
on:
  push:
    branches: [ main, release ]
  pull_request:
    # feature/** too: stacked work such as feature/mobile-web (#76) is checked before it
    # reaches main.
    branches: [ main, release, "feature/**" ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0 # TODO: remove this when we cache the builds

jobs:
  ci:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      run: rustup update

    - name: build
      run: cargo build --all --release

    - name: test
      run: |
        cargo test --release --all-targets

        #cd file-tree-merge/tests/scripts
        #sh tests.sh
      shell: bash

    - name: upload binary
      if: ${{ !startsWith(matrix.runner, 'windows') }}
      uses: actions/upload-artifact@v4
      with:
        name: syncoxiders_${{ matrix.runner }}
        path: target/release/syncoxiders

    - name: upload binary
      if: startsWith(matrix.runner, 'windows')
      uses: actions/upload-artifact@v4
      with:
        name: syncoxiders_${{ matrix.runner }}
        path: target/release/syncoxiders.exe

  p2p-browser-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      run: rustup toolchain install nightly --target wasm32-unknown-unknown

    - name: Install wasm-pack
      run: cargo install wasm-pack --version 0.13.1 --locked

    - name: Test OPFS worker recovery
      working-directory: p2p-transfer
      run: node --test tests/resume_worker.test.mjs

    - name: Test WebRTC in Firefox
      working-directory: p2p-transfer
      run: wasm-pack test --headless --firefox -- --test webrtc_wasm

    - name: Test persistent resume in Firefox
      working-directory: p2p-transfer
      run: wasm-pack test --headless --firefox -- --test resume_wasm

  # The Dioxus web UI (p2p-transfer/web, #67): lint, release bundle, and a bundle-size
  # report in the job summary (fails over the brotli budget in build-web.sh).
  web-dioxus:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: p2p-transfer
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Rust
      # Installs the toolchain p2p-transfer/rust-toolchain pins, with wasm32.
      run: rustup toolchain install

    - name: fmt and clippy
      run: |
        cargo fmt -p oxfer-web -- --check
        cargo clippy --locked -p oxfer-web --target wasm32-unknown-unknown -- -D warnings -W clippy::all
        cargo clippy --locked -p oxfer-web -- -D warnings -W clippy::all

    - name: Bundle-size reporter tests
      run: node --test tests/report-bundle-size.test.mjs

    - name: dx bundle (release) and size report
      env:
        OXFER_WEB_UI: dioxus
      run: bash build-web.sh
