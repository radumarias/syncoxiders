name: ci
on:
  push:
    branches: [ main, release ]
  pull_request:
    branches: [ main, release ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0 # TODO: remove this when we cache the builds

jobs:
  ci:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      run: rustup update

    - name: build
      run: cargo build --all --release

    - name: test
      run: |
        cargo test --release --all-targets

        #cd file-tree-merge/tests/scripts
        #sh tests.sh
      shell: bash

    - name: upload binary
      if: ${{ !startsWith(matrix.runner, 'windows') }}
      uses: actions/upload-artifact@v4
      with:
        name: syncoxiders_${{ matrix.runner }}
        path: target/release/syncoxiders

    - name: upload binary
      if: startsWith(matrix.runner, 'windows')
      uses: actions/upload-artifact@v4
      with:
        name: syncoxiders_${{ matrix.runner }}
        path: target/release/syncoxiders.exe

  # The node suites and the relay kit check need no Rust toolchain, so they
  # run apart from the browser job and do not wait for its wasm-pack install.
  # tests/package-cf-output.test.mjs fails if these two jobs miss a node,
  # wasm-pack or render.sh line of p2p-transfer/check.sh.
  p2p-web-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22

    # Every node suite in p2p-transfer/tests: OPFS worker recovery, page
    # scripts, the relay list parser, CSP rendering and packaging, the dist
    # and legal-page guards, deployment header checks and the CSP rules for
    # served pages.
    - name: Test web scripts, headers and pages
      working-directory: p2p-transfer
      run: node --test tests/*.test.mjs

    - name: Check the relay kit's generated files
      working-directory: p2p-transfer
      run: sh deploy/relay/render.sh --check

  p2p-browser-integration:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      run: rustup toolchain install nightly --target wasm32-unknown-unknown

    - name: Install wasm-pack
      run: cargo install wasm-pack --version 0.13.1 --locked

    - name: Test WebRTC in Firefox
      working-directory: p2p-transfer
      run: wasm-pack test --headless --firefox -- --test webrtc_wasm

    - name: Test default relay map in Firefox
      working-directory: p2p-transfer
      run: wasm-pack test --headless --firefox -- --test relay_wasm

    - name: Test persistent resume in Firefox
      working-directory: p2p-transfer
      run: wasm-pack test --headless --firefox -- --test resume_wasm
