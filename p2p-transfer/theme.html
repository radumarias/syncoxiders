<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oxfer theme lab</title>
<link id="favicon" rel="icon" type="image/svg+xml" sizes="any"
    href="assets/oxfer-favicon-light.svg"
    data-light="assets/oxfer-favicon-light.svg" data-dark="assets/oxfer-favicon-dark.svg">
<script defer src="assets/favicon.js"></script>
<style>
  :root {
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    color: #182b3c;
    --lab-bg: #e5ebf1;
    --lab-card: #ffffff;
    --lab-line: #c9d8e3;
    --lab-muted: #455b6d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--lab-bg); }
  header.lab-bar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 14px 20px; background: #f8fafc; border-bottom: 1px solid var(--lab-line);
    position: sticky; top: 0; z-index: 5;
  }
  header.lab-bar h1 { font-size: 18px; margin: 0 12px 0 0; }
  header.lab-bar p { margin: 0; color: var(--lab-muted); font-size: 13px; flex: 1; min-width: 180px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  button, .file-btn {
    font: 600 13px/1 Inter, ui-sans-serif, system-ui, sans-serif;
    border-radius: 10px; padding: 10px 14px; cursor: pointer; border: 1px solid #45627a;
    background: #fff; color: #182b3c;
  }
  button.primary { background: #2077c1; color: #fff; border-color: #2077c1; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .layout { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; gap: 0; min-height: calc(100vh - 62px); }
  @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }
  .editor { background: #f8fafc; border-right: 1px solid var(--lab-line); padding: 18px 18px 48px; overflow: auto; }
  .preview-pane { padding: 18px; overflow: auto; }
  label.field { display: block; font-size: 12px; font-weight: 650; margin: 12px 0 6px; }
  input[type=text], input[type=number] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--lab-line); border-radius: 8px; font: 14px ui-monospace, Menlo, monospace;
  }
  textarea { width: 100%; min-height: 56px; padding: 8px 10px; border: 1px solid var(--lab-line); border-radius: 8px; font: 14px Inter, sans-serif; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mode-tabs { display: flex; gap: 6px; margin: 16px 0 8px; }
  .mode-tabs button[aria-pressed=true] { background: #2077c1; color: #fff; border-color: #2077c1; }
  .token {
    display: grid; grid-template-columns: 1fr 36px 108px; gap: 8px; align-items: center;
    margin: 6px 0;
  }
  .token span { font-size: 12px; color: var(--lab-muted); }
  .token input[type=color] { width: 36px; height: 28px; padding: 0; border: 1px solid var(--lab-line); border-radius: 6px; background: none; }
  .token input[type=text] { font-size: 12px; padding: 6px 8px; }
  .hint { font-size: 12px; color: var(--lab-muted); margin: 8px 0; }
  .extracted { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .extracted i { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--lab-line); display: block; }
  .contrast { font-size: 12px; margin: 4px 0; }
  .ok { color: #1b6bb4; }
  .bad { color: #a72c30; font-weight: 650; }
  .preview-toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .preview-toolbar button[aria-pressed=true] { background: #182b3c; color: #fff; border-color: #182b3c; }
  .stage {
    --bg: #e5ebf1; --surface-lowest: #f5f8fb; --surface-low: #fff; --surface: #f8fafc;
    --surface-high: #deebf6; --primary: #2077c1; --on-primary: #fff; --secondary: #1b6bb4;
    --on-surface: #182b3c; --on-surface-var: #455b6d; --outline: #45627a; --outline-var: #c9d8e3;
    --error: #a72c30; --r-control: 18px; --r-card: 20px; --r-outline: 10px;
    background: var(--bg); color: var(--on-surface); border: 1px solid var(--outline-var);
    border-radius: 16px; overflow: hidden; max-width: 1040px;
  }
  .stage.compact { max-width: 390px; }
  .app-header {
    height: 64px; display: flex; align-items: center; gap: 8px; padding: 0 16px 0 20px;
    background: var(--surface); border-bottom: 1px solid var(--outline-var);
  }
  .app-header img { height: 22px; width: auto; }
  .stage.compact .app-header img { height: 20px; }
  .grow { flex: 1; }
  .pill {
    font: 700 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .02em;
    border: 1px solid var(--secondary); color: var(--secondary);
    background: color-mix(in srgb, var(--secondary) 7%, transparent);
    border-radius: 20px; padding: 6px 10px; white-space: nowrap;
  }
  .btn {
    font: 700 14px/1 Inter, sans-serif; min-height: 44px; padding: 11px 18px; border-radius: var(--r-outline);
    border: 1px solid var(--outline); background: transparent; color: var(--outline); cursor: default;
  }
  .btn.primary {
    background: var(--primary); color: var(--on-primary); border-color: var(--primary);
    border-radius: var(--r-control); font-size: 15px; min-height: 46px;
  }
  .btn.copied { background: var(--secondary); border-color: var(--secondary); color: var(--on-primary); }
  .body { padding: 20px; }
  .hero, .card {
    background: var(--surface-low); border: 1px solid var(--outline-var);
    border-radius: var(--r-card); padding: 22px;
  }
  .hero h2 { margin: 12px 0 8px; font-size: 34px; line-height: 1.15; }
  .stage.compact .hero h2 { font-size: 26px; }
  .muted { color: var(--on-surface-var); }
  .steps { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 16px; }
  .stage.compact .steps { grid-template-columns: 1fr; }
  .step { background: var(--surface-low); border: 1px solid var(--outline-var); border-radius: 16px; padding: 14px; }
  .step h3 { margin: 0 0 6px; font-size: 16px; }
  .file {
    display: flex; gap: 12px; align-items: center; background: var(--surface);
    border: 1px solid var(--outline-var); border-radius: 16px; padding: 12px;
  }
  .file .glyph {
    width: 36px; height: 36px; border-radius: 18px; background: var(--surface-high);
    color: var(--secondary); display: grid; place-items: center; font-weight: 800;
  }
  .warn { color: var(--error); font-size: 13px; margin-top: 12px; }
  .linkbox {
    font: 12px ui-monospace, Menlo, monospace; background: var(--surface-lowest);
    border: 1px solid var(--outline-var); border-radius: 8px; padding: 10px; word-break: break-all;
  }
  .footer {
    height: 50px; display: flex; align-items: center; padding: 0 16px;
    background: var(--surface-lowest); border-top: 1px solid var(--outline-var);
    color: var(--secondary); font: 13px ui-monospace, Menlo, monospace;
  }
  .status { font-size: 13px; color: var(--lab-muted); min-height: 1.2em; }
</style>
</head>
<body>
<header class="lab-bar">
  <h1>Oxfer theme lab</h1>
  <p>Pick colors, preview the app, export a bundle to hand back for implementation.</p>
  <div class="actions">
    <button type="button" id="load-clean">Start from Clean</button>
    <button type="button" id="load-rusty">Start from Rusty</button>
    <label class="file-btn">Upload palette image<input id="palette-image" type="file" accept="image/*" hidden></label>
    <label class="file-btn">Import JSON<input id="import" type="file" accept=".json,application/json" hidden></label>
    <button type="button" class="primary" id="export-json">Export JSON</button>
    <button type="button" class="primary" id="export-zip">Export zip</button>
  </div>
</header>
<div class="layout">
  <aside class="editor">
    <label class="field" for="name">Theme name</label>
    <input id="name" type="text" placeholder="e.g. Forest" autocomplete="off">
    <label class="field" for="intent">Intent</label>
    <textarea id="intent" placeholder="One line: cool messenger, warm workshop, high-contrast night…"></textarea>
    <label class="field" for="author">Your name (optional)</label>
    <input id="author" type="text" autocomplete="name">
    <div class="row">
      <div>
        <label class="field" for="r-control">Control radius</label>
        <input id="r-control" type="number" min="0" max="32" value="18">
      </div>
      <div>
        <label class="field" for="r-card">Card radius</label>
        <input id="r-card" type="number" min="0" max="32" value="20">
      </div>
    </div>
    <div class="mode-tabs">
      <button type="button" id="edit-light" aria-pressed="true">Edit light</button>
      <button type="button" id="edit-dark" aria-pressed="false">Edit dark</button>
    </div>
    <p class="hint">These 13 token names are the app API. Change values, not names. Upload a Coolors / swatch image to fill both light and dark.</p>
    <div id="extracted" class="extracted" hidden></div>
    <div id="tokens"></div>
    <h3 style="margin:20px 0 6px;font-size:14px">Contrast</h3>
    <div id="contrast"></div>
    <p class="status" id="status"></p>
  </aside>
  <main class="preview-pane">
    <div class="preview-toolbar">
      <button type="button" id="prev-light" aria-pressed="true">Preview light</button>
      <button type="button" id="prev-dark" aria-pressed="false">Preview dark</button>
      <button type="button" id="prev-home" aria-pressed="true">Home</button>
      <button type="button" id="prev-send" aria-pressed="false">Send</button>
      <button type="button" id="prev-wide" aria-pressed="true">Desktop</button>
      <button type="button" id="prev-compact" aria-pressed="false">Mobile</button>
    </div>
    <div class="stage" id="stage"></div>
  </main>
</div>
<script src="assets/theme-lab.js"></script>
</body>
</html>
