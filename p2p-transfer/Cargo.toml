[package]
name = "p2p-transfer"
description.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation.workspace = true
exclude.workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
egui = "0.36.1"
eframe = { version = "0.36.1", default-features = false, features = [
    "accesskit",     # Make egui compatible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
    "wayland",       # To support Linux (and CI)
    "x11",           # To support older Linux distributions (restores one of the default features)
] }
log = "0.4.34"

# You only need serde if you want app persistence:
serde = { version = "1.0.229", features = ["derive"] }
anyhow.workspace = true
blake3 = "1.8.7"
# The four below carry no call sites yet: they are the frozen dependency set the
# transport work builds against (chunk buffers, wire encoding, share tickets,
# cancellation). Declared here so the lock is resolved once, in this step.
bytes = "1.12"                                                 # chunk buffers
postcard = { version = "1.1.3", features = ["use-std"] }       # wire encoding
n0-future = "0.3.2"
iroh-tickets = "1.0.0"                                         # EndpointTicket (share links)
tokio-util = "0.7"                                             # CancellationToken

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iroh = "1.1.0"
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "io-util",
    "fs",
] }
rfd = "0.17.2"
env_logger = "0.11.11"
# Bao tree for BitTorrent-like verified streaming (merkle tree)
bao-tree = "0.16.1"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
# `tls-ring` is REQUIRED on wasm: without a TLS provider feature `presets::N0`/`Minimal`
# and the crypto provider do not exist.
iroh = { version = "1.1.0", default-features = false, features = ["tls-ring"] }
# Override tokio to exclude net feature for WASM
tokio = { version = "1.53", default-features = false, features = [
    "io-util",
    "macros",
    "sync",
    "rt",
] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
blake3 = { version = "1.8.7", features = ["wasm32_simd"] }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
js-sys = "0.3.104"
send_wrapper = "0.6"     # no call sites yet: wraps !Send JS handles for the transport work
tracing-wasm = "0.2.1"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.104", features = [
    # DOM / shell
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlAnchorElement",
    "HtmlIFrameElement",
    "HtmlCanvasElement",
    "Event",
    "EventTarget",
    "MessageEvent",
    "Location",
    "History",
    "Navigator",
    "console",
    # files
    "File",
    "FileList",
    "FileReader",
    "Blob",
    "BlobPropertyBag",
    "Url",
    # WebRTC
    "RtcPeerConnection",
    "RtcConfiguration",
    "RtcIceServer",
    "RtcDataChannel",
    "RtcDataChannelInit",
    "RtcDataChannelType",
    "RtcDataChannelState",
    "RtcDataChannelEvent",
    "RtcSessionDescription",
    "RtcSessionDescriptionInit",
    "RtcSdpType",
    "RtcIceCandidate",
    "RtcIceCandidateInit",
    "RtcPeerConnectionIceEvent",
    "RtcPeerConnectionState",
    "RtcIceConnectionState",
    "RtcStatsReport",
    # File System Access (Chromium)
    "FileSystemHandle",
    "FileSystemFileHandle",
    "FileSystemDirectoryHandle",
    "FileSystemWritableFileStream",
    "FileSystemGetFileOptions",
    "WritableStream",
    "SaveFilePickerOptions",
    # service-worker streaming sink
    "ServiceWorkerContainer",
    "ServiceWorker",
    "ServiceWorkerRegistration",
    "MessageChannel",
    "MessagePort",
] }
