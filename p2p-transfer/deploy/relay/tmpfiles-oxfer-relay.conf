# No lastlog on the Oxfer relay host. Installed as
# /etc/tmpfiles.d/oxfer-relay.conf by setup.sh, applied at once and on every
# boot. sshd writes each user's last login and source address to
# /var/log/lastlog and never removes it. Pointed at /dev/null, sshd skips
# it and logs "lastlog_openseek: ... is not a file or directory!" instead.
# This file sorts before systemd's var.conf, whose line creating the file on
# Debian 12 and Ubuntu 24.04 is then ignored as a duplicate.
L+ /var/log/lastlog - - - - /dev/null
