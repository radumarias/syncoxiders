#cloud-config
# Oxfer relay host (relay.oxfer.app) on Debian 12/13 or Ubuntu 24.04.
# GENERATED by render.sh from the files next to it; do not edit.
#
# Paste this whole file into the provider's "user data" / "cloud-init" field
# when creating the server, and select your SSH key in the provider's panel.
# Create the DNS records first (README.md, "DNS").
#
# First boot writes the kit to /opt/oxfer-relay/ and runs setup.sh, which
# installs the pinned, checksum-verified iroh-relay binary, the systemd unit,
# the firewall, journald retention, key-only SSH and unattended upgrades.
# Progress: tail -f /var/log/cloud-init-output.log

ssh_pwauth: false
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - nftables
  - unattended-upgrades

write_files:
  - path: /opt/oxfer-relay/setup.sh
    owner: root:root
    permissions: "0755"
    content: |
      #!/bin/sh
      # Oxfer relay host setup for Debian 12/13 and Ubuntu 24.04. Run as root.
      #
      # Idempotent. cloud-init.yaml runs it on first boot from /opt/oxfer-relay/.
      # Run it by hand on a provider without user data, after an upgrade of the
      # pins below, and in the yearly rebuild rehearsal:
      #   cd p2p-transfer/deploy/relay
      #   tar -cf - . | ssh root@HOST \
      #     'mkdir -p /opt/oxfer-relay && tar -C /opt/oxfer-relay --no-same-owner -xf - && sh /opt/oxfer-relay/setup.sh'
      #
      # It installs a prebuilt, checksum-verified iroh-relay binary and never
      # compiles anything on the host.
      set -eu

      # Relay release, pinned by version and SHA-256. Keep the version equal to
      # the iroh version in the workspace Cargo.lock. Assets are the static musl
      # builds published on the n0-computer/iroh GitHub release:
      #   https://github.com/n0-computer/iroh/releases/download/v$RELAY_VERSION/iroh-relay-v$RELAY_VERSION-<target>.tar.gz
      # Hashes computed from the downloaded assets on 2026-09-30; they equal the
      # digests GitHub lists for the release assets.
      RELAY_VERSION=1.1.0
      RELAY_SHA256_X86_64=9a68108b824e4164ad2eec729cf0e8167e4cb50581cb745a242bace135df7614
      RELAY_SHA256_AARCH64=1b4261b6dd0d17ae9a7516aa6d122b296a77678bac174ce30262702c9f91cb00

      KIT_DIR=$(CDPATH='' cd -- "$(dirname -- "$0")" && pwd)
      BIN=/usr/local/bin/iroh-relay

      log() { printf 'oxfer-relay-setup: %s\n' "$*"; }
      die() { printf 'oxfer-relay-setup: ERROR: %s\n' "$*" >&2; exit 1; }

      [ "$(id -u)" -eq 0 ] || die "run as root"
      for f in config.toml iroh-relay.service nftables.conf journald-oxfer-relay.conf \
      	sshd-oxfer-relay.conf unattended-upgrades.conf; do
      	[ -f "$KIT_DIR/$f" ] || die "missing $KIT_DIR/$f"
      done

      # shellcheck source=/dev/null
      . /etc/os-release
      case "${ID:-}:${VERSION_ID:-}" in
      debian:12 | debian:13 | ubuntu:24.04) ;;
      *) log "WARNING: untested system ${ID:-?} ${VERSION_ID:-?}; continuing" ;;
      esac

      # 1. Packages. rsyslog would copy the journal into /var/log with weeks of
      # retention; the journal, capped at three days, is the only log store here.
      # On first boot apt's daily timers may hold the dpkg lock; wait for it.
      export DEBIAN_FRONTEND=noninteractive
      apt_get() { apt-get -o DPkg::Lock::Timeout=600 "$@"; }
      apt_get update -q
      apt_get install -y -q --no-install-recommends ca-certificates curl nftables unattended-upgrades
      if dpkg-query -W -f='${Status}' rsyslog 2>/dev/null | grep -q 'ok installed'; then
      	apt_get purge -y -q rsyslog
      fi

      # 2. Relay binary.
      case "$(uname -m)" in
      x86_64) target=x86_64-unknown-linux-musl sha=$RELAY_SHA256_X86_64 ;;
      aarch64 | arm64) target=aarch64-unknown-linux-musl sha=$RELAY_SHA256_AARCH64 ;;
      *) die "no pinned iroh-relay build for $(uname -m)" ;;
      esac
      restart_relay=0
      if [ "$("$BIN" --version 2>/dev/null || true)" != "iroh-relay $RELAY_VERSION" ]; then
      	asset="iroh-relay-v$RELAY_VERSION-$target.tar.gz"
      	tmp=$(mktemp -d)
      	trap 'rm -rf "$tmp"' EXIT
      	log "downloading $asset"
      	curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-delay 3 -o "$tmp/$asset" \
      		"https://github.com/n0-computer/iroh/releases/download/v$RELAY_VERSION/$asset"
      	printf '%s  %s\n' "$sha" "$tmp/$asset" | sha256sum -c --quiet - ||
      		die "SHA-256 mismatch for $asset; refusing to install"
      	tar -xzf "$tmp/$asset" -C "$tmp" ./iroh-relay
      	[ "$("$tmp/iroh-relay" --version)" = "iroh-relay $RELAY_VERSION" ] ||
      		die "downloaded binary does not report version $RELAY_VERSION"
      	install -m 0755 -o root -g root "$tmp/iroh-relay" "$BIN.new"
      	mv -f "$BIN.new" "$BIN"
      	restart_relay=1
      	log "installed $("$BIN" --version)"
      fi

      # 3. Configuration files. install_file SRC DST MODE; returns 0 when DST changed.
      install_file() {
      	if cmp -s "$1" "$2"; then return 1; fi
      	install -D -m "$3" -o root -g root "$1" "$2"
      	log "updated $2"
      }

      if install_file "$KIT_DIR/config.toml" /etc/iroh-relay/config.toml 0644; then restart_relay=1; fi
      if install_file "$KIT_DIR/iroh-relay.service" /etc/systemd/system/iroh-relay.service 0644; then restart_relay=1; fi
      if install_file "$KIT_DIR/journald-oxfer-relay.conf" /etc/systemd/journald.conf.d/zz-oxfer-relay.conf 0644; then
      	systemctl restart systemd-journald
      	journalctl --rotate >/dev/null 2>&1 || true
      	journalctl --vacuum-time=3d >/dev/null 2>&1 || true
      fi
      install_file "$KIT_DIR/unattended-upgrades.conf" /etc/apt/apt.conf.d/52oxfer-relay 0644 || true

      # 4. Firewall: check first, then load, so a bad file never drops the host's
      # existing rules.
      install -d -m 0755 /etc/nftables.d
      nft -c -f "$KIT_DIR/nftables.conf" || die "nftables.conf does not validate"
      install_file "$KIT_DIR/nftables.conf" /etc/nftables.conf 0755 || true
      systemctl enable nftables >/dev/null 2>&1
      systemctl restart nftables

      # 5. SSH: key-only, but only once a key is actually installed.
      has_key=0
      for k in /root/.ssh/authorized_keys /home/*/.ssh/authorized_keys; do
      	if [ -s "$k" ] && grep -Eq '^(ssh-|ecdsa-|sk-)' "$k"; then has_key=1; fi
      done
      if [ ! -x /usr/sbin/sshd ]; then
      	log "sshd not installed; skipping SSH hardening"
      elif [ "$has_key" -eq 0 ]; then
      	log "WARNING: no authorized SSH key found; password login left as is"
      else
      	# Ubuntu 24.04 starts sshd through ssh.socket, so its privilege
      	# separation directory (RuntimeDirectory=sshd) may not exist yet, and
      	# "sshd -t" fails without it.
      	install -d -m 0755 /run/sshd
      	cp /etc/ssh/sshd_config.d/01-oxfer-relay.conf /tmp/oxfer-sshd.bak 2>/dev/null || true
      	if install_file "$KIT_DIR/sshd-oxfer-relay.conf" /etc/ssh/sshd_config.d/01-oxfer-relay.conf 0644; then
      		if /usr/sbin/sshd -t; then
      			systemctl try-reload-or-restart ssh.service
      		else
      			log "WARNING: sshd rejected the drop-in; restoring the previous one"
      			if [ -f /tmp/oxfer-sshd.bak ]; then
      				mv -f /tmp/oxfer-sshd.bak /etc/ssh/sshd_config.d/01-oxfer-relay.conf
      			else
      				rm -f /etc/ssh/sshd_config.d/01-oxfer-relay.conf
      			fi
      		fi
      	fi
      	rm -f /tmp/oxfer-sshd.bak
      fi

      # 6. Unattended upgrades and the relay itself.
      systemctl enable --now unattended-upgrades.service >/dev/null 2>&1 || true
      systemctl daemon-reload
      systemctl enable iroh-relay.service >/dev/null 2>&1
      if [ "$restart_relay" -eq 1 ]; then
      	systemctl restart iroh-relay.service
      else
      	systemctl start iroh-relay.service
      fi

      # 7. Local smoke test: the plain-HTTP captive-portal endpoint answers even
      # before the certificate exists.
      i=0
      until [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1/generate_204 || true)" = 204 ]; do
      	i=$((i + 1))
      	[ "$i" -lt 10 ] || die "relay does not answer on port 80; see: journalctl -u iroh-relay"
      	sleep 1
      done
      log "relay is running: $("$BIN" --version)"
      log "next: verify from outside, see README.md (First-boot verification)"
  - path: /opt/oxfer-relay/config.toml
    owner: root:root
    permissions: "0644"
    content: |
      # iroh-relay 1.1.0 configuration for relay.oxfer.app.
      # Installed as /etc/iroh-relay/config.toml and read with
      #   iroh-relay --config-path /etc/iroh-relay/config.toml
      #
      # Every key comes from the config structs of the iroh-relay 1.1.0 binary
      # (Config, TlsConfig, Limits, PerClientRateLimitConfig, RateLimitConfig in
      # src/main.rs). None of them uses #[serde(deny_unknown_fields)], so a
      # misspelt or misplaced key is silently ignored rather than rejected. Keep
      # keys exactly where they are, and re-check them against src/main.rs when
      # the relay version changes.
      #
      # Line references are to iroh-relay-1.1.0/src/main.rs unless a file is named.

      # Relay service on (main.rs:104-105; default true, main.rs:371-373).
      enable_relay = true

      # Plain-HTTP listener. With [tls] present it answers only GET /generate_204,
      # the captive-portal check native iroh clients send to http://<relay>/
      # (src/server.rs:802-816 and 1161-1186; iroh-1.1.0
      # src/net_report/reportgen.rs:620). Everything else gets 404. Certificates
      # do not use this port (see cert_mode below).
      # Field main.rs:118; default [::]:80 (main.rs:339-342). "[::]" is dual-stack
      # on Linux with the default net.ipv6.bindv6only=0, so one socket serves both
      # the A and the AAAA record.
      http_bind_addr = "[::]:80"

      # QUIC address discovery (QAD) on UDP, used by native clients only; browsers
      # never send UDP to the relay. Field main.rs:133-134, default false.
      # Requires [tls] (main.rs:585-587).
      enable_quic_addr_discovery = true

      # Aggregate Prometheus counters, no per-client data (main.rs:142-143,
      # default true).
      enable_metrics = true
      # Must stay on loopback. When unset it defaults to the http_bind_addr IP with
      # port 9090, which would be [::]:9090 on every interface (main.rs:344-347).
      metrics_bind_addr = "127.0.0.1:9090"

      # Relay access for every endpoint (main.rs:154-155 and 158-197). Oxfer shares
      # use fresh endpoint keys, so an allowlist cannot work. 1.1.0 also accepts
      #   access.denylist = ["<endpoint id>", ...]
      # (main.rs:166-167 and 260-272); see "Abuse blocking" in README.md.
      access = "everyone"

      [tls]
      # HTTPS and WSS listener: /relay, /ping, /healthz, / and /robots.txt
      # (src/server.rs:731-740). Field main.rs:399; default is the http_bind_addr
      # IP with port 443 (main.rs:460-463).
      https_bind_addr = "[::]:443"

      # QAD socket. Field main.rs:406; default is the https_bind_addr IP with port
      # 7842 (main.rs:465-469, src/defaults.rs:7). Clients assume 7842 for a relay
      # URL without explicit QUIC settings (src/relay_map.rs:272-283; iroh-1.1.0
      # src/net_report/reportgen.rs:648-658), so do not move it. noq 1.2.0 clears
      # IPV6_V6ONLY on this socket, so it is dual-stack (noq src/endpoint.rs:129-135).
      quic_bind_addr = "[::]:7842"

      # Certificates from Let's Encrypt. Variant names are case-sensitive: Manual,
      # LetsEncrypt, Reloading (main.rs:62-68). The ACME client, tokio-rustls-acme
      # 0.9.1, answers only the TLS-ALPN-01 challenge, on the HTTPS listener itself
      # (tokio-rustls-acme src/acme.rs:187-191; src/server/http_server.rs:1088-1096),
      # so TCP 443 must reach this process directly: no TLS-terminating proxy.
      cert_mode = "LetsEncrypt"

      # Certificate name; a string or a list (main.rs:407-409 and 488-503).
      hostname = "relay.oxfer.app"

      # Required in LetsEncrypt mode, sent as mailto: (main.rs:445-448 and 644-655).
      contact = "ops@oxfer.app"

      # true selects the Let's Encrypt production directory (main.rs:430-444,
      # default true). Set false only while debugging DNS or the firewall, to stay
      # clear of production rate limits, then set it back.
      prod_tls = true

      # ACME account key and certificate cache (main.rs:414-417 and 656). Files are
      # named cached_account_<hash> and cached_cert_<hash>
      # (tokio-rustls-acme src/caches/dir.rs:41-59). Lives in the systemd
      # StateDirectory, so it survives restarts and upgrades.
      cert_dir = "/var/lib/iroh-relay/certs"

      # Rate limits (main.rs:505-513). In 1.1.0 only the per-client receive limit
      # is implemented. accept_conn_limit and accept_conn_burst are parsed but have
      # no effect (src/server.rs:486-499), so they are left out; nftables.conf
      # limits new connections per source address instead.
      [limits.client.rx]
      # Token bucket on bytes read from each client connection (main.rs:515-534 and
      # 727-752). Both are u32 and must be non-zero. 25 MiB/s steady, 50 MiB burst.
      bytes_per_second = 26214400
      max_burst_bytes = 52428800
  - path: /opt/oxfer-relay/iroh-relay.service
    owner: root:root
    permissions: "0644"
    content: |
      # iroh-relay 1.1.0 for Oxfer (relay.oxfer.app).
      # Installed as /etc/systemd/system/iroh-relay.service by setup.sh.
      # Check:  systemd-analyze verify /etc/systemd/system/iroh-relay.service
      # Audit:  systemd-analyze security iroh-relay.service

      [Unit]
      Description=iroh relay server for Oxfer (relay.oxfer.app)
      Documentation=https://github.com/radumarias/syncoxiders/tree/main/p2p-transfer/deploy/relay
      Wants=network-online.target
      After=network-online.target nftables.service

      [Service]
      Type=exec
      ExecStart=/usr/local/bin/iroh-relay --config-path /etc/iroh-relay/config.toml

      # Logging. The relay writes tracing output to stderr and has no access-log
      # option; RUST_LOG (EnvFilter, src/main.rs:568-571) is the only control.
      #  - At "info", per-connection spans add the client IP and port to every
      #    connection error (conn{peer=...}, src/server/http_server.rs:499).
      #  - At "warn", those spans are off, but each failed or probed connection
      #    still writes a line.
      #  - This filter keeps startup failures, ACME errors and server-task failures
      #    (target iroh_relay::server) and silences the per-connection targets. A
      #    span-scoped directive such as "[conn]=off" cannot do this, because
      #    EnvFilter ORs span directives with target directives.
      # What remains per request is one line per malformed request on port 80,
      # with the parser error and no address.
      Environment="RUST_LOG=off,iroh_relay=warn,iroh_relay::server::http_server=off,iroh_relay::server::client=off,iroh_relay::server::streams=off,iroh_relay::protos=off,iroh_metrics=warn"
      Environment=NO_COLOR=1
      StandardOutput=journal
      StandardError=journal
      SyslogIdentifier=iroh-relay

      # The binary shuts down gracefully only on SIGINT (tokio::signal::ctrl_c,
      # src/main.rs:605-611).
      KillSignal=SIGINT
      TimeoutStopSec=15s
      Restart=on-failure
      RestartSec=5s

      # Identity and state. cert_dir (/var/lib/iroh-relay/certs) holds the ACME
      # account key and the certificate, so they survive restarts and upgrades.
      DynamicUser=yes
      StateDirectory=iroh-relay
      StateDirectoryMode=0700
      WorkingDirectory=/var/lib/iroh-relay
      UMask=0077

      # Ports 80 and 443 need CAP_NET_BIND_SERVICE; nothing else is granted.
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      CapabilityBoundingSet=CAP_NET_BIND_SERVICE
      NoNewPrivileges=yes

      # One file descriptor per relayed WebSocket connection.
      LimitNOFILE=65536

      # Sandbox.
      ProtectSystem=strict
      ProtectHome=yes
      PrivateTmp=yes
      PrivateDevices=yes
      DevicePolicy=closed
      ProtectClock=yes
      ProtectHostname=yes
      ProtectKernelTunables=yes
      ProtectKernelModules=yes
      ProtectKernelLogs=yes
      ProtectControlGroups=yes
      ProtectProc=invisible
      ProcSubset=pid
      RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
      RestrictNamespaces=yes
      RestrictRealtime=yes
      RestrictSUIDSGID=yes
      LockPersonality=yes
      MemoryDenyWriteExecute=yes
      RemoveIPC=yes
      SystemCallArchitectures=native
      SystemCallFilter=@system-service
      SystemCallFilter=~@privileged
      SystemCallErrorNumber=EPERM

      [Install]
      WantedBy=multi-user.target
  - path: /opt/oxfer-relay/nftables.conf
    owner: root:root
    permissions: "0644"
    content: |
      #!/usr/sbin/nft -f
      # Firewall for the Oxfer relay host (relay.oxfer.app).
      # Installed as /etc/nftables.conf by setup.sh and loaded by nftables.service.
      #   Check:  nft -c -f /etc/nftables.conf
      #   Apply:  systemctl reload nftables
      #
      # Inbound is dropped by default. Nothing here logs packets or addresses.
      #
      # Host-specific additions (SSH source addresses, permanent bans) go in
      # /etc/nftables.d/*.nft on the server, included at the end of this file.
      # Keep them out of this public repository; setup.sh never touches that
      # directory. Reloading replaces the whole ruleset, so bans added at runtime
      # with "nft add element" are lost on reload or reboot unless also written
      # to a local file.

      flush ruleset

      table inet oxfer_relay {
      	# Abuse blocking. Traffic from these addresses is dropped before anything
      	# else, including connections that are already open.
      	#   Temporary ban, until it expires, the ruleset reloads or the host reboots:
      	#     nft add element inet oxfer_relay banned_v4 '{ 203.0.113.7 timeout 30d }'
      	#     nft add element inet oxfer_relay banned_v6 '{ 2001:db8:1:2::/64 timeout 30d }'
      	#   Lift it:
      	#     nft delete element inet oxfer_relay banned_v4 '{ 203.0.113.7 }'
      	#   Permanent ban, in /etc/nftables.d/bans.nft on the server:
      	#     add element inet oxfer_relay banned_v4 { 203.0.113.7 }
      	set banned_v4 {
      		type ipv4_addr
      		flags interval, timeout
      	}

      	set banned_v6 {
      		type ipv6_addr
      		flags interval, timeout
      	}

      	# Per-source new-connection limit on the relay's TCP ports. iroh-relay
      	# 1.1.0 parses accept_conn_limit but does not implement it
      	# (src/server.rs:486-499), so this takes its place. A browser opens one
      	# WebSocket per session plus a few HTTPS latency probes, so the limit
      	# leaves room for many users behind one carrier-grade NAT address. IPv6
      	# is keyed on the /64, which is what one subscriber usually gets.
      	set relay_flood_v4 {
      		type ipv4_addr
      		flags dynamic, timeout
      		timeout 1m
      		size 65536
      	}

      	set relay_flood_v6 {
      		type ipv6_addr
      		flags dynamic, timeout
      		timeout 1m
      		size 65536
      	}

      	set ssh_flood_v4 {
      		type ipv4_addr
      		flags dynamic, timeout
      		timeout 1m
      		size 4096
      	}

      	set ssh_flood_v6 {
      		type ipv6_addr
      		flags dynamic, timeout
      		timeout 1m
      		size 4096
      	}

      	# SSH access. Open to all by default; authentication is key-only (see
      	# sshd-oxfer-relay.conf). To allow only your own addresses, create
      	# /etc/nftables.d/ssh.nft on the server with, for example:
      	#   flush chain inet oxfer_relay ssh_access
      	#   add rule inet oxfer_relay ssh_access ip saddr 198.51.100.10 accept
      	#   add rule inet oxfer_relay ssh_access ip6 saddr 2001:db8:10::/64 accept
      	#   add rule inet oxfer_relay ssh_access drop
      	# and keep the provider's web console as the way back in.
      	chain ssh_access {
      		accept
      	}

      	chain input {
      		type filter hook input priority filter; policy drop;

      		ip saddr @banned_v4 drop
      		ip6 saddr @banned_v6 drop

      		ct state invalid drop
      		ct state { established, related } accept
      		iif "lo" accept

      		# ICMP needed for path MTU discovery, error reporting and ping.
      		icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
      		icmp type echo-request limit rate 20/second burst 50 packets accept

      		# ICMPv6: neighbour discovery and router advertisements (required for
      		# IPv6 to work at all; RFC 4861 sends them with hop limit 255), MLD
      		# queries from the link, path MTU discovery, errors and ping.
      		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } ip6 hoplimit 255 accept
      		icmpv6 type mld-listener-query ip6 saddr fe80::/10 accept
      		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept
      		icmpv6 type echo-request limit rate 20/second burst 50 packets accept

      		# SSH, rate-limited per source, then the ssh_access policy.
      		tcp dport 22 ct state new add @ssh_flood_v4 { ip saddr limit rate over 10/minute burst 20 packets } drop
      		tcp dport 22 ct state new add @ssh_flood_v6 { ip6 saddr & ffff:ffff:ffff:ffff:: limit rate over 10/minute burst 20 packets } drop
      		tcp dport 22 jump ssh_access

      		# Relay: HTTPS and WSS on 443 (relaying, latency probes, ACME
      		# TLS-ALPN-01), plain HTTP on 80 (captive-portal check only).
      		tcp dport { 80, 443 } ct state new add @relay_flood_v4 { ip saddr limit rate over 50/second burst 200 packets } drop
      		tcp dport { 80, 443 } ct state new add @relay_flood_v6 { ip6 saddr & ffff:ffff:ffff:ffff:: limit rate over 50/second burst 200 packets } drop
      		tcp dport { 80, 443 } accept

      		# QUIC address discovery for native clients (iroh default port 7842).
      		udp dport 7842 accept

      		# Everything else, including the metrics port 9090, falls to the drop
      		# policy. The metrics server is bound to 127.0.0.1 anyway.
      	}

      	chain forward {
      		type filter hook forward priority filter; policy drop;
      	}

      	chain output {
      		type filter hook output priority filter; policy accept;
      	}
      }

      # Host-specific additions, not tracked in the repository. A pattern with no
      # matching files is not an error.
      include "/etc/nftables.d/*.nft"
  - path: /opt/oxfer-relay/journald-oxfer-relay.conf
    owner: root:root
    permissions: "0644"
    content: |
      # Journal retention for the Oxfer relay host.
      # Installed as /etc/systemd/journald.conf.d/zz-oxfer-relay.conf by setup.sh.
      # The journal is the only log store on this host (setup.sh removes rsyslog).
      # Drop-ins apply in file-name order across /usr/lib and /etc and the last
      # value wins. The zz- prefix sorts after syslog.conf, which Debian 13's
      # systemd package ships with ForwardToSyslog=yes.

      [Journal]
      Storage=persistent
      SystemMaxUse=200M
      RuntimeMaxUse=50M
      MaxRetentionSec=3day
      # Retention deletes whole archived journal files, and the active file is
      # otherwise rotated only monthly (MaxFileSec defaults to one month). Daily
      # rotation makes the three-day limit effective.
      MaxFileSec=1day
      ForwardToSyslog=no
  - path: /opt/oxfer-relay/sshd-oxfer-relay.conf
    owner: root:root
    permissions: "0644"
    content: |
      # Key-only SSH for the Oxfer relay host.
      # Installed as /etc/ssh/sshd_config.d/01-oxfer-relay.conf by setup.sh, and
      # only when an authorized key is present, so a fresh box cannot lock you out.
      # sshd uses the first value it reads for each option, and Debian and Ubuntu
      # read sshd_config.d/*.conf in name order before sshd_config. The 01- prefix
      # puts this file ahead of cloud-init's 50-cloud-init.conf.
      PubkeyAuthentication yes
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AuthenticationMethods publickey
      PermitRootLogin prohibit-password
      MaxAuthTries 3
      LoginGraceTime 30
      X11Forwarding no
      AllowAgentForwarding no
      # "local" keeps ssh -L working, e.g. to read the metrics on 127.0.0.1:9090.
      AllowTcpForwarding local
  - path: /opt/oxfer-relay/unattended-upgrades.conf
    owner: root:root
    permissions: "0644"
    content: |
      // Unattended OS upgrades for the Oxfer relay host.
      // Installed as /etc/apt/apt.conf.d/52oxfer-relay by setup.sh. Files in
      // apt.conf.d are read in name order and later values win, so this overrides
      // 20auto-upgrades. The upgrade origins stay at the distribution's default
      // (security updates) from 50unattended-upgrades.
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      // Reboot when an upgrade requires it (kernel, libc), at 03:30 in the
      // server's time zone (UTC on most VPS images). Open relay connections drop
      // and clients reconnect within about a minute.
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
      Unattended-Upgrade::Automatic-Reboot-Time "03:30";

runcmd:
  - [sh, /opt/oxfer-relay/setup.sh]
