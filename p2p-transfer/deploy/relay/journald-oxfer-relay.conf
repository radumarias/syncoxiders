# Journal retention for the Oxfer relay host.
# Installed as /etc/systemd/journald.conf.d/zz-oxfer-relay.conf by setup.sh.
# The journal is the only log store on this host (setup.sh removes rsyslog).
# Drop-ins apply in file-name order across /usr/lib and /etc and the last
# value wins. The zz- prefix sorts after syslog.conf, which Debian 13's
# systemd package ships with ForwardToSyslog=yes.

[Journal]
Storage=persistent
SystemMaxUse=200M
RuntimeMaxUse=50M
MaxRetentionSec=3day
# Retention deletes whole archived journal files, and the active file is
# otherwise rotated only monthly (MaxFileSec defaults to one month). Daily
# rotation makes the three-day limit effective.
MaxFileSec=1day
ForwardToSyslog=no
