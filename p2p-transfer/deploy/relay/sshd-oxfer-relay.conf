# Key-only SSH for the Oxfer relay host.
# Installed as /etc/ssh/sshd_config.d/01-oxfer-relay.conf by setup.sh, and
# only when an authorized key is present, so a fresh box cannot lock you out.
# sshd uses the first value it reads for each option, and Debian and Ubuntu
# read sshd_config.d/*.conf in name order before sshd_config. The 01- prefix
# puts this file ahead of cloud-init's 50-cloud-init.conf.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
AuthenticationMethods publickey
PermitRootLogin prohibit-password
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
# "local" keeps ssh -L working, e.g. to read the metrics on 127.0.0.1:9090.
AllowTcpForwarding local
# /var/log/lastlog is a link to /dev/null here (tmpfiles-oxfer-relay.conf),
# so there is no last login to print.
PrintLastLog no
