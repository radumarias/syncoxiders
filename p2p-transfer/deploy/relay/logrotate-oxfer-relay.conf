# Login records on the Oxfer relay host, emptied daily.
# Installed as /etc/logrotate.d/oxfer-relay by setup.sh, which deletes the
# packages' own /etc/logrotate.d/wtmp, btmp and wtmpdb (monthly or yearly;
# logrotate rejects two entries for one file). dpkg does not bring back a
# deleted conffile. sshd writes wtmp (logins) and, on Debian 12 and Ubuntu
# 24.04, btmp (unknown users); Debian 13's sshd also writes wtmp.db.
# rotate 0 deletes the old file at each rotation. logrotate.timer runs daily
# between 00:00 and 01:00, and at boot after downtime (Persistent=true), so a
# record lasts about a day at most. ifempty keeps rotating when nothing was
# written. The journal keeps the same sshd events for three days.
/var/log/wtmp /var/log/btmp /var/log/wtmp.db {
	daily
	rotate 0
	ifempty
	missingok
	create
}
