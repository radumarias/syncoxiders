#!/usr/sbin/nft -f
# Firewall for the Oxfer relay host (relay.oxfer.app).
# Installed as /etc/nftables.conf by setup.sh and loaded by nftables.service.
#   Check:  nft -c -f /etc/nftables.conf
#   Apply:  systemctl reload nftables
#
# Inbound is dropped by default. Nothing here logs packets or addresses.
#
# Host-specific additions (SSH source addresses, IP bans) go in
# /etc/nftables.d/*.nft on the server, included at the end of this file.
# Keep them out of this public repository; setup.sh never writes there and
# reloads this ruleset only when this file changed. A reload replaces the
# whole ruleset, so a ban added with a bare "nft add element" is lost on the
# next reload or reboot; oxfer-relay-ban keeps bans in bans.nft there.

flush ruleset

table inet oxfer_relay {
	# Abuse blocking. Traffic from these addresses is dropped before anything
	# else, including connections that are already open. Fill them with
	# oxfer-relay-ban (setup.sh installs it), which also writes each ban with
	# its expiry to /etc/nftables.d/bans.nft. Every ban expires; adding the
	# address again with a number of days extends it:
	#   oxfer-relay-ban add 203.0.113.7            (30 days)
	#   oxfer-relay-ban add 2001:db8:1:2::/64 90   (1 to 365 days)
	#   oxfer-relay-ban del 203.0.113.7
	set banned_v4 {
		type ipv4_addr
		flags interval, timeout
	}

	set banned_v6 {
		type ipv6_addr
		flags interval, timeout
	}

	# Per-source new-connection limit on the relay's TCP ports. iroh-relay
	# 1.1.0 parses accept_conn_limit but does not implement it
	# (src/server.rs:486-499), so this takes its place. A browser opens one
	# WebSocket per session plus a few HTTPS latency probes, so the limit
	# leaves room for many users behind one carrier-grade NAT address. IPv6
	# is keyed on the /64, which is what one subscriber usually gets.
	# These four sets hold a source address for at most 60 seconds: "add"
	# never refreshes an element's timeout, so it expires 1m after creation.
	set relay_flood_v4 {
		type ipv4_addr
		flags dynamic, timeout
		timeout 1m
		size 65536
	}

	set relay_flood_v6 {
		type ipv6_addr
		flags dynamic, timeout
		timeout 1m
		size 65536
	}

	set ssh_flood_v4 {
		type ipv4_addr
		flags dynamic, timeout
		timeout 1m
		size 4096
	}

	set ssh_flood_v6 {
		type ipv6_addr
		flags dynamic, timeout
		timeout 1m
		size 4096
	}

	# SSH access. Open to all by default; authentication is key-only (see
	# sshd-oxfer-relay.conf). To allow only your own addresses, create
	# /etc/nftables.d/ssh.nft on the server with, for example:
	#   flush chain inet oxfer_relay ssh_access
	#   add rule inet oxfer_relay ssh_access ip saddr 198.51.100.10 accept
	#   add rule inet oxfer_relay ssh_access ip6 saddr 2001:db8:10::/64 accept
	#   add rule inet oxfer_relay ssh_access drop
	# and keep the provider's web console as the way back in.
	chain ssh_access {
		accept
	}

	chain input {
		type filter hook input priority filter; policy drop;

		ip saddr @banned_v4 drop
		ip6 saddr @banned_v6 drop

		ct state invalid drop
		ct state { established, related } accept
		iif "lo" accept

		# ICMP needed for path MTU discovery, error reporting and ping.
		icmp type { destination-unreachable, time-exceeded, parameter-problem } accept
		icmp type echo-request limit rate 20/second burst 50 packets accept

		# ICMPv6: neighbour discovery and router advertisements (required for
		# IPv6 to work at all; RFC 4861 sends them with hop limit 255), MLD
		# queries from the link, path MTU discovery, errors and ping.
		icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } ip6 hoplimit 255 accept
		icmpv6 type mld-listener-query ip6 saddr fe80::/10 accept
		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept
		icmpv6 type echo-request limit rate 20/second burst 50 packets accept

		# DHCPv6 replies. They come from the server's link-local address, not
		# the multicast address the request went to, so conntrack does not
		# match them. Some providers (IONOS Cloud) assign IPv6 by DHCPv6.
		ip6 saddr fe80::/10 ip6 daddr fe80::/10 udp sport 547 udp dport 546 accept

		# SSH, rate-limited per source, then the ssh_access policy.
		tcp dport 22 ct state new add @ssh_flood_v4 { ip saddr limit rate over 10/minute burst 20 packets } drop
		tcp dport 22 ct state new add @ssh_flood_v6 { ip6 saddr & ffff:ffff:ffff:ffff:: limit rate over 10/minute burst 20 packets } drop
		tcp dport 22 jump ssh_access

		# Relay: HTTPS and WSS on 443 (relaying, latency probes, ACME
		# TLS-ALPN-01), plain HTTP on 80 (captive-portal check only).
		tcp dport { 80, 443 } ct state new add @relay_flood_v4 { ip saddr limit rate over 50/second burst 200 packets } drop
		tcp dport { 80, 443 } ct state new add @relay_flood_v6 { ip6 saddr & ffff:ffff:ffff:ffff:: limit rate over 50/second burst 200 packets } drop
		tcp dport { 80, 443 } accept

		# QUIC address discovery for native clients (iroh default port 7842).
		udp dport 7842 accept

		# Everything else, including the metrics port 9090, falls to the drop
		# policy. The metrics server is bound to 127.0.0.1 anyway.
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

# Host-specific additions, not tracked in the repository. A pattern with no
# matching files is not an error.
include "/etc/nftables.d/*.nft"
