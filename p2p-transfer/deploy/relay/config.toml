# iroh-relay 1.1.0 configuration for relay.oxfer.app.
# Installed as /etc/iroh-relay/config.toml and read with
#   iroh-relay --config-path /etc/iroh-relay/config.toml
#
# Every key comes from the config structs of the iroh-relay 1.1.0 binary
# (Config, TlsConfig, Limits, PerClientRateLimitConfig, RateLimitConfig in
# src/main.rs). None of them uses #[serde(deny_unknown_fields)], so a
# misspelt or misplaced key is silently ignored rather than rejected. Keep
# keys exactly where they are, and re-check them against src/main.rs when
# the relay version changes.
#
# Line references are to iroh-relay-1.1.0/src/main.rs unless a file is named.

# Relay service on (main.rs:104-105; default true, main.rs:371-373).
enable_relay = true

# Plain-HTTP listener. With [tls] present it answers only GET /generate_204,
# the captive-portal check native iroh clients send to http://<relay>/
# (src/server.rs:802-816 and 1161-1186; iroh-1.1.0
# src/net_report/reportgen.rs:620). Everything else gets 404. Certificates
# do not use this port (see cert_mode below).
# Field main.rs:118; default [::]:80 (main.rs:339-342). "[::]" is dual-stack
# on Linux with the default net.ipv6.bindv6only=0, so one socket serves both
# the A and the AAAA record.
http_bind_addr = "[::]:80"

# QUIC address discovery (QAD) on UDP, used by native clients only; browsers
# never send UDP to the relay. Field main.rs:133-134, default false.
# Requires [tls] (main.rs:585-587).
enable_quic_addr_discovery = true

# Aggregate Prometheus counters, no per-client data (main.rs:142-143,
# default true).
enable_metrics = true
# Must stay on loopback. When unset it defaults to the http_bind_addr IP with
# port 9090, which would be [::]:9090 on every interface (main.rs:344-347).
metrics_bind_addr = "127.0.0.1:9090"

# Relay access for every endpoint (main.rs:154-155 and 158-197). Oxfer shares
# use fresh endpoint keys, so an allowlist cannot work. 1.1.0 also accepts
#   access.denylist = ["<endpoint id>", ...]
# (main.rs:166-167 and 260-272); see "Abuse blocking" in README.md.
access = "everyone"

[tls]
# HTTPS and WSS listener: /relay, /ping, /healthz, / and /robots.txt
# (src/server.rs:731-740). Field main.rs:399; default is the http_bind_addr
# IP with port 443 (main.rs:460-463).
https_bind_addr = "[::]:443"

# QAD socket. Field main.rs:406; default is the https_bind_addr IP with port
# 7842 (main.rs:465-469, src/defaults.rs:7). Clients assume 7842 for a relay
# URL without explicit QUIC settings (src/relay_map.rs:272-283; iroh-1.1.0
# src/net_report/reportgen.rs:648-658), so do not move it. noq 1.2.0 clears
# IPV6_V6ONLY on this socket, so it is dual-stack (noq src/endpoint.rs:129-135).
quic_bind_addr = "[::]:7842"

# Certificates from Let's Encrypt. Variant names are case-sensitive: Manual,
# LetsEncrypt, Reloading (main.rs:62-68). The ACME client, tokio-rustls-acme
# 0.9.1, answers only the TLS-ALPN-01 challenge, on the HTTPS listener itself
# (tokio-rustls-acme src/acme.rs:187-191; src/server/http_server.rs:1088-1096),
# so TCP 443 must reach this process directly: no TLS-terminating proxy.
cert_mode = "LetsEncrypt"

# Certificate name; a string or a list (main.rs:407-409 and 488-503).
hostname = "relay.oxfer.app"

# Required in LetsEncrypt mode, sent as mailto: (main.rs:445-448 and 644-655).
contact = "ops@oxfer.app"

# true selects the Let's Encrypt production directory (main.rs:430-444,
# default true). Set false only while debugging DNS or the firewall, to stay
# clear of production rate limits, then set it back.
prod_tls = true

# ACME account key and certificate cache (main.rs:414-417 and 656). Files are
# named cached_account_<hash> and cached_cert_<hash>
# (tokio-rustls-acme src/caches/dir.rs:41-59). Lives in the systemd
# StateDirectory, so it survives restarts and upgrades.
cert_dir = "/var/lib/iroh-relay/certs"

# Rate limits (main.rs:505-513). In 1.1.0 only the per-client receive limit
# is implemented. accept_conn_limit and accept_conn_burst are parsed but have
# no effect (src/server.rs:486-499), so they are left out; nftables.conf
# limits new connections per source address instead.
[limits.client.rx]
# Token bucket on bytes read from each client connection (main.rs:515-534 and
# 727-752). Both are u32 and must be non-zero. 25 MiB/s steady, 50 MiB burst.
bytes_per_second = 26214400
max_burst_bytes = 52428800
