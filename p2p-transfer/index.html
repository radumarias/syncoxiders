<!DOCTYPE html>
<html>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<head>
    <title>Oxfer</title>

    <link data-trunk rel="rust" data-wasm-opt="2" />
    <base data-trunk-public-url />

    <link data-trunk rel="copy-file" href="assets/favicon.ico">
    <link data-trunk rel="copy-file" href="assets/oxfer-mark.svg" data-target-path="assets">
    <link rel="icon" type="image/svg+xml" href="assets/oxfer-mark.svg">
    <link rel="alternate icon" href="favicon.ico">


    <link data-trunk rel="copy-file" href="assets/sw.js"/>
    <link data-trunk rel="copy-file" href="assets/diagnostics.js" data-target-path="assets"/>
    <link data-trunk rel="copy-file" href="assets/manifest.json" data-target-path="assets"/>
    <link data-trunk rel="copy-file" href="assets/_headers"/>
    <link data-trunk rel="copy-file" href="assets/icon-1024.png" data-target-path="assets"/>
    <link data-trunk rel="copy-file" href="assets/icon-256.png" data-target-path="assets"/>
    <link data-trunk rel="copy-file" href="assets/icon_ios_touch_192.png" data-target-path="assets"/>
    <link data-trunk rel="copy-file" href="assets/maskable_icon_x512.png" data-target-path="assets"/>


    <link rel="manifest" href="assets/manifest.json">
    <link rel="apple-touch-icon" href="assets/icon_ios_touch_192.png">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1d2835">


    <style>
        html {
            touch-action: manipulation;
            overscroll-behavior: none;
        }

        body {

            background: #e5ebf1;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #0e1621;
            }
        }

        /* Allow canvas to fill entire web page: */
        html,
        body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
        }

        canvas {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .centered {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #2077c1;
            font-size: 24px;
            font-family: Ubuntu-Light, Helvetica, sans-serif;
            text-align: center;
        }

        .lds-dual-ring {
            display: inline-block;
            width: 24px;
            height: 24px;
        }

        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 24px;
            height: 24px;
            margin: 0px;
            border-radius: 50%;
            border: 3px solid #50a2e9;
            border-color: #50a2e9 transparent #50a2e9 transparent;
            animation: lds-dual-ring 1.2s linear infinite;
        }

        @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <canvas id="the_canvas_id"></canvas>
    <div class="centered" id="loading_text">
        <p style="font-size:16px">
            Loading…
        </p>
        <div class="lds-dual-ring"></div>
    </div>

    <script>
        // Capture the full href before the wasm app can scrub the fragment
        // (it removes the ticket/cap once it has read them, §4.7.1).
        const orig = location.href;
        const flags = location.hash.slice(1).split('&');

        if ('serviceWorker' in navigator) {
            if (flags.includes('dev')) {
                // #dev is a hard reset: unregister every worker and clear
                // every cache so a stale cache-first build can never shadow
                // this load (Trunk.toml's filehash = false means the wasm
                // bundle's filename never changes between builds).
                const wasControlled = !!navigator.serviceWorker.controller;
                Promise.all([
                    navigator.serviceWorker.getRegistrations()
                        .then(rs => Promise.all(rs.map(r => r.unregister()))),
                    caches.keys()
                        .then(ks => Promise.all(ks.map(k => caches.delete(k)))),
                ]).then(() => {
                    if (wasControlled) {
                        // Reloads at most once: after unregister, there is no
                        // controller left, so this branch is not re-entered.
                        // Restore the original href immediately before
                        // reloading — replaceState + reload run in one
                        // synchronous task, so the wasm's fragment scrub can
                        // never interleave between them.
                        history.replaceState(null, '', orig);
                        location.reload();
                    }
                });
            } else {
                // Start before Save can be clicked. The streaming sink waits for
                // this exact registration to control the page, including first visit.
                window.p2pServiceWorkerRegistration = navigator.serviceWorker.register(
                    new URL('sw.js', document.baseURI), { scope: new URL('.', document.baseURI).href }
                );
                // Keep the rejected promise for actionable sink errors, without
                // an unhandled rejection when the user never starts a download.
                window.p2pServiceWorkerRegistration.catch(error => console.warn('Service worker unavailable:', error));
            }
        }
    </script>
</body>

</html>
