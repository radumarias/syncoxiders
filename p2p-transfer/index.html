<!DOCTYPE html>
<html>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<head>
    <title>Oxfer</title>

    <link data-trunk rel="rust" data-wasm-opt="2" />
    <base data-trunk-public-url />
    <!-- Trunk.toml inject_scripts = false: assets/app-init.js loads the wasm
         app, so no inline script is needed (Content-Security-Policy). -->
    <link rel="modulepreload" href="p2p-transfer.js">
    <link rel="preload" href="p2p-transfer_bg.wasm" as="fetch" type="application/wasm" crossorigin>

    <link data-trunk rel="copy-file" href="theme.html">
    <link data-trunk rel="copy-file" href="privacy.html">
    <link data-trunk rel="copy-file" href="terms.html">
    <link data-trunk rel="copy-file" href="abuse.html">
    <link data-trunk rel="copy-file" href="assets/boot.js" data-target-path="assets">
    <link data-trunk rel="copy-file" href="assets/app-init.js" data-target-path="assets">
    <link data-trunk rel="copy-file" href="assets/theme-lab.js" data-target-path="assets">
    <link data-trunk rel="copy-file" href="assets/legal.css" data-target-path="assets">
    <link data-trunk rel="copy-file" href="assets/oxfer-favicon-light.svg" data-target-path="assets">
    <link data-trunk rel="copy-file" href="assets/oxfer-favicon-dark.svg" data-target-path="assets">
    <link data-trunk rel="copy-file" href="assets/favicon.js" data-target-path="assets">
    <link data-trunk rel="copy-file" href="assets/oxfer-ox.svg" data-target-path="assets">
    <link data-trunk rel="copy-file" href="assets/oxfer-mark.svg" data-target-path="assets">
    <link data-trunk rel="copy-file" href="assets/oxfer-wordmark-light.svg" data-target-path="assets">
    <link data-trunk rel="copy-file" href="assets/oxfer-wordmark-dark.svg" data-target-path="assets">
    <link id="favicon" rel="icon" type="image/svg+xml" sizes="any"
        href="assets/oxfer-favicon-light.svg"
        data-light="assets/oxfer-favicon-light.svg" data-dark="assets/oxfer-favicon-dark.svg">
    <script defer src="assets/favicon.js"></script>


    <link data-trunk rel="copy-file" href="assets/sw.js"/>
    <link data-trunk rel="copy-file" href="assets/diagnostics.js" data-target-path="assets"/>
    <link data-trunk rel="copy-file" href="assets/theme.js" data-target-path="assets"/>
    <link data-trunk rel="copy-file" href="assets/manifest.json" data-target-path="assets"/>
    <link data-trunk rel="copy-file" href="assets/_headers"/>
    <link data-trunk rel="copy-file" href="assets/icon-1024.png" data-target-path="assets"/>
    <link data-trunk rel="copy-file" href="assets/icon-256.png" data-target-path="assets"/>
    <link data-trunk rel="copy-file" href="assets/icon_ios_touch_192.png" data-target-path="assets"/>
    <link data-trunk rel="copy-file" href="assets/maskable_icon_x512.png" data-target-path="assets"/>


    <link rel="manifest" href="assets/manifest.json">
    <link rel="apple-touch-icon" href="assets/icon_ios_touch_192.png">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f7">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#23263a">


    <style>
        html {
            touch-action: manipulation;
            overscroll-behavior: none;
        }

        body {

            background: #e4e4e4;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #151724;
            }
        }

        /* Allow canvas to fill entire web page: */
        html,
        body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
        }

        canvas {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .centered {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #1674d8;
            font-size: 24px;
            font-family: Ubuntu-Light, Helvetica, sans-serif;
            text-align: center;
        }

        .brand-logo {
            display: block;
            height: 40px;
            width: auto;
            margin: 0 auto 18px;
        }

        .brand-logo-dark {
            display: none;
        }

        @media (prefers-color-scheme: dark) {
            .brand-logo-light {
                display: none;
            }

            .brand-logo-dark {
                display: block;
            }
        }

        .lds-dual-ring {
            display: inline-block;
            width: 24px;
            height: 24px;
        }

        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 24px;
            height: 24px;
            margin: 0px;
            border-radius: 50%;
            border: 3px solid #1a88fe;
            border-color: #1a88fe transparent #1a88fe transparent;
            animation: lds-dual-ring 1.2s linear infinite;
        }

        @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <canvas id="the_canvas_id"></canvas>
    <div class="centered" id="loading_text">
        <img class="brand-logo brand-logo-light" src="assets/oxfer-wordmark-light.svg" alt="Oxfer" width="256" height="40">
        <img class="brand-logo brand-logo-dark" src="assets/oxfer-wordmark-dark.svg" alt="Oxfer" width="256" height="40">
        <p style="font-size:16px">
            Loading…
        </p>
        <div class="lds-dual-ring"></div>
    </div>

    <script src="assets/boot.js"></script>
    <script type="module" src="assets/app-init.js"></script>
</body>

</html>
